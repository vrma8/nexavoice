version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./nexavoice.db
      - AGORA_APP_ID=demo_agora_app_id
      - AGORA_APP_CERTIFICATE=demo_agora_app_certificate
      - TELEPHONY_PROVIDER=simulator
      - ENVIRONMENT=production
    volumes:
      - ./backend/nexavoice.db:/app/nexavoice.db
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/live
    depends_on:
      - backend
    restart: unless-stopped
